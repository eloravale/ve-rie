name = "veria"
main = "dist-worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "veria-db"
database_id = "PLACEHOLDER_run_npx_wrangler_d1_create_veria-db"
migrations_dir = "migrations"

[vars]
VERIA_DEMO_MODE = "true"
# Phase 0: configure before any customer-facing deployment.
# VERIA_ALLOWED_ORIGINS = "https://app.yourdomain.com"
# Secrets (VERIA_ADMIN_TOKEN) belong in `wrangler secret put VERIA_ADMIN_TOKEN`,
# never in this file. VERIA_PROTECTED_MODE=1 forces fail-closed destructive routes.
